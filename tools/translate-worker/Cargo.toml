[package]
name = "translate-worker"
version = "0.1.0"
edition = "2021"
description = "Translation worker for aruaru-llm: M2M100 on CTranslate2 (MIT), Connect JSON over localhost."
license = "MIT"
publish = false

# aruaru-llm 本体のワークスペースには入れない(CTranslate2のC++ビルドを本体に持ち込まないため)。
[workspace]

[dependencies]
anyhow = "1"
ct2rs = { version = "0.11", default-features = false, features = ["ruy"] }
sentencepiece = "0.11"
serde_json = "1"
tiny_http = "0.12"
