name: Release binaries

# タグ(例: v0.1.0)をpushすると、Linux(x86_64-unknown-linux-gnu)・
# Windows(x86_64)向けにビルドし、GitHub Releasesへ添付する。
#
# sibling path依存: Cargo.tomlが`../open-cuda/crates/opencuda-*`を
# path依存しているため、CI環境でも同じ相対位置(リポジトリルートの
# 1つ上)へopen-cudaをcheckoutする(aruaru-db/open-web-server/RPoemで
# 実際に踏んだ「sibling path依存を忘れるとCI失敗」という罠を踏まない
# ための対応、詳細はopen-raid-z/CLAUDE.md参照)。
#
# 正直な開示: このバイナリは起動時に470MB超のmultilingual-e5-small
# モデル重みを実行時に読み込む(このワークフローには含まれない、
# install.sh/install.ps1に案内あり)。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling path dependencies (open-cuda, open-cpu, RPoem, RS-JSON, open-web-server, RS-SmartTCP, open-raid-z)
        # RPoem(open-runo-poem-compat)はopen-runo-router経由でopen-web-server-wire/core/ledgerへ
        # path依存し、open-web-server-wireはさらにRS-SmartTCPへ、RS-SmartTCPは
        # open-raid-zへpath依存する(2026-08-17、実際にCIで踏んだ多段の
        # sibling path依存チェーン)。
        #
        # 2026-09-08 BUG修正: Cargo.tomlがopen-cpu(CPU命令セット検出/SIMD
        # 加速)へもpath依存するようになったが、このcheckoutステップが
        # open-cpuのcloneを欠いていたため、v0.2.3タグのリリースCIが
        # 「failed to read open-cpu/Cargo.toml」で全面的に失敗し、
        # Linux/Windowsとも成果物が一切公開されない状態になっていた
        # (open-english側のインストーラーが「aruaru-llmも同時インストール」
        # を選んでも実際には何も取得できない、という形で発覚した実バグ)。
        run: |
          git clone --depth=1 https://github.com/aon-co-jp/open-cuda.git ../open-cuda
          git clone --depth=1 https://github.com/aon-co-jp/open-cpu.git ../open-cpu
          git clone --depth=1 https://github.com/aon-co-jp/RPoem.git ../RPoem
          git clone --depth=1 https://github.com/aon-co-jp/RS-JSON.git ../RS-JSON
          git clone --depth=1 https://github.com/aon-co-jp/open-web-server.git ../open-web-server
          git clone --depth=1 https://github.com/aon-co-jp/RS-SmartTCP.git ../RS-SmartTCP
          git clone --depth=1 https://github.com/aon-co-jp/open-raid-z.git ../open-raid-z
      - name: Build
        run: cargo build --release --bin aruaru-llm
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/aruaru-llm dist/aruaru-llm
          cp install.sh dist/install.sh
          tar -czf aruaru-llm-linux-x86_64.tar.gz -C dist aruaru-llm install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aruaru-llm-linux-x86_64
          path: aruaru-llm-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling path dependencies (open-cuda, open-cpu, RPoem, RS-JSON, open-web-server, RS-SmartTCP, open-raid-z)
        # RPoem(open-runo-poem-compat)はopen-runo-router経由でopen-web-server-wire/core/ledgerへ
        # path依存し、open-web-server-wireはさらにRS-SmartTCPへ、RS-SmartTCPは
        # open-raid-zへpath依存する(2026-08-17、実際にCIで踏んだ多段の
        # sibling path依存チェーン)。
        #
        # 2026-09-08 BUG修正: open-cpuのcloneが欠けていた(上記Linuxジョブの
        # コメント参照)。
        run: |
          git clone --depth=1 https://github.com/aon-co-jp/open-cuda.git ../open-cuda
          git clone --depth=1 https://github.com/aon-co-jp/open-cpu.git ../open-cpu
          git clone --depth=1 https://github.com/aon-co-jp/RPoem.git ../RPoem
          git clone --depth=1 https://github.com/aon-co-jp/RS-JSON.git ../RS-JSON
          git clone --depth=1 https://github.com/aon-co-jp/open-web-server.git ../open-web-server
          git clone --depth=1 https://github.com/aon-co-jp/RS-SmartTCP.git ../RS-SmartTCP
          git clone --depth=1 https://github.com/aon-co-jp/open-raid-z.git ../open-raid-z
      - name: Build (default, CPU-only)
        run: cargo build --release --bin aruaru-llm
      - name: Package portable zip (aruaru-llm-windows-x86_64.zip)
        # 2026-09-08新設(BUG修正): このWindowsジョブは以前、Inno Setup製の
        # aruaru-llm-installer.exe(独自のProgram Files配置+アンインストーラー
        # を持つ、単体利用者向け)しか出力していなかった。しかし
        # open-english側の`fetch-aruaru-llm.ps1`・`server/src/main.rs`の
        # `maybe_launch_aruaru_llm`は、実行ファイル1本を
        # `{app}\aruaru-llm\aruaru-llm.exe`という相対配置に展開して
        # 子プロセスとして直接起動する「ポータブルzip」を前提に設計されて
        # おり(v0.1.0リリース当時は実際にzipを配布していた)、この
        # 前提が途中でzip配布をやめた際に更新されないまま残っていた。
        # 結果、open-englishインストーラーが「aruaru-llmも同時インストール」
        # (現在は必須・常時実行)を行っても、最新リリースにzipアセットが
        # 無いため何も取得できず、起動しても「⚙ Setup aruaru-llm.」画面の
        # ままになるという実バグが発生していた。ここでzip配布を復活させ、
        # 単体インストーラー(installer.exe)とポータブルzipの両方を
        # 引き続き公開する。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-zip | Out-Null
          Copy-Item target\release\aruaru-llm.exe dist-zip\aruaru-llm.exe
          Compress-Archive -Path dist-zip\aruaru-llm.exe -DestinationPath aruaru-llm-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aruaru-llm-windows-x86_64
          path: aruaru-llm-windows-x86_64.zip
      - name: Build (GPU acceleration variant — open-cuda Vulkan+DirectX "SET")
        # ユーザー指示「aruaru-llmはopen-cudaとopen-directxと一緒に使用した
        # 方が本領を発揮するならSETでダウンロードしてインストールする
        # 仕様に」への対応。open-cuda/open-directxはRustライブラリのため
        # 「一緒にインストール」の実体は「この2つのバックエンドを組み込んで
        # ビルドした1本の実行ファイル」——別のtarget dirへビルドし、
        # デフォルト(CPU)版を上書きしないようにする。正直な開示:
        # このGPU版が実際に速いとは限らない(installer/windows/
        # README-INSTALLED.txt・aruaru-llm.iss参照、開発機での実測では
        # CPU版より遅かった)——インストーラー側で既定オフのオプトイン
        # タスクとして提供する。
        #
        # continue-on-error(2026-09-08): open-cudaのDirectXシェーダー
        # 事前コンパイル(.dxil)がCI環境に無く現状失敗する(別課題、未調査)。
        # aruaru-llm.issは`#ifexist`でGPUバイナリの有無を見て条件分岐する
        # ため、この段が失敗してもCPU版インストーラー・Windows zipの
        # ビルド・公開は継続させる。
        continue-on-error: true
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target-gpu"
          cargo build --release --bin aruaru-llm --features hw-detect-vulkan,real-vulkan,hw-detect-directx,real-dx12
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build aruaru-llm-windows-x86_64-installer.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\windows\aruaru-llm.iss
      - uses: actions/upload-artifact@v4
        with:
          name: aruaru-llm-windows-x86_64-installer
          path: installer/windows/dist/aruaru-llm-windows-x86_64-installer.exe

  release:
    name: GitHub Releaseへ添付
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            aruaru-llm-linux-x86_64/aruaru-llm-linux-x86_64.tar.gz
            aruaru-llm-windows-x86_64-installer/aruaru-llm-windows-x86_64-installer.exe
            aruaru-llm-windows-x86_64/aruaru-llm-windows-x86_64.zip
