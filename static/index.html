<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>aruaru-llm — お勧めLLMをダウンロード</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
  h1 { font-size: 1.3rem; }
  button { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.6; }
  #status { white-space: pre-wrap; background: #f4f4f4; padding: 0.8rem; border-radius: 6px; margin-top: 1rem; font-size: 0.9rem; }
  .disclosure { font-size: 0.8rem; color: #666; margin-top: 0.5rem; }
  #genArea { margin-top: 1.5rem; display: none; }
  textarea { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<h1>aruaru-llm — ハードウェア検出とお勧めLLMダウンロード</h1>
<p>このマシンのGPU/VRAMを検出し、実行に適したGPT-2互換モデルのサイズを推奨した上で、
未取得であればHugging Faceから自動ダウンロードします。</p>

<button id="recommendBtn">お勧めLLMをダウンロード</button>
<button id="largerBtn">一つ大きなモデルをダウンロードする</button>
<button id="smallerBtn">一つ小さなモデルをダウンロードする</button>
<div id="status">まだ実行していません。</div>
<p class="disclosure" id="disclosure"></p>

<div id="genArea">
  <h2>生成テスト</h2>
  <textarea id="prompt" rows="2">The quick brown fox</textarea><br>
  <button id="genBtn">生成テスト実行</button>
  <div id="genResult"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const disclosureEl = document.getElementById('disclosure');
const btn = document.getElementById('recommendBtn');
const largerBtn = document.getElementById('largerBtn');
const smallerBtn = document.getElementById('smallerBtn');
const genArea = document.getElementById('genArea');
const genBtn = document.getElementById('genBtn');
const genResult = document.getElementById('genResult');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  statusEl.textContent = 'ハードウェアを検出しています...(GPU検出→推奨サイズ算出→未取得ならダウンロード。数百MB〜数GBの場合、数分かかることがあります)';
  try {
    const res = await fetch('/aruaru_llm.v1.Llm/RecommendAndDownload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = 'エラー: ' + (data.error || res.status);
      btn.disabled = false;
      return;
    }
    const hw = data.recommendation.hardware;
    const gpuLine = hw.gpu_detected
      ? `GPU検出: ${hw.gpu_name} (経路: ${hw.detection_path}, VRAM: ${(hw.vram_bytes / (1024**3)).toFixed(2)} GB)`
      : `GPU未検出(CPUのみとみなします、経路: ${hw.detection_path})`;
    statusEl.textContent =
      gpuLine + '\n' +
      `推奨モデル: ${data.recommendation.recommended_model_id}\n` +
      `既にダウンロード済みだったか: ${data.already_installed ? 'はい' : 'いいえ(今回ダウンロードしました)'}\n` +
      `切り替え成功: ${data.switched_to_recommended ? 'はい' : 'いいえ'}\n` +
      data.message_ja;
    disclosureEl.textContent = data.recommendation.disclosure_ja;
    if (data.switched_to_recommended) {
      genArea.style.display = 'block';
    }
  } catch (e) {
    statusEl.textContent = '通信エラー: ' + e;
  } finally {
    btn.disabled = false;
  }
});

async function stepModelSize(path, button) {
  button.disabled = true;
  statusEl.textContent = '確認しています...(未取得ならダウンロード。数百MB〜数GBの場合、数分かかることがあります)';
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = 'エラー: ' + (data.error || res.status);
      return;
    }
    let text = `現在: ${data.from_id}\n`;
    if (data.to_id) {
      text += `切り替え先: ${data.to_id}\n` +
        `既にダウンロード済みだったか: ${data.already_installed ? 'はい' : 'いいえ(今回ダウンロードしました)'}\n` +
        `切り替え成功: ${data.switched ? 'はい' : 'いいえ'}\n`;
    }
    text += data.message_ja;
    statusEl.textContent = text;
    if (data.switched) {
      genArea.style.display = 'block';
    }
  } catch (e) {
    statusEl.textContent = '通信エラー: ' + e;
  } finally {
    button.disabled = false;
  }
}

largerBtn.addEventListener('click', () => stepModelSize('/aruaru_llm.v1.Llm/DownloadLarger', largerBtn));
smallerBtn.addEventListener('click', () => stepModelSize('/aruaru_llm.v1.Llm/DownloadSmaller', smallerBtn));

genBtn.addEventListener('click', async () => {
  genBtn.disabled = true;
  genResult.textContent = '生成中...';
  try {
    const prompt = document.getElementById('prompt').value;
    const res = await fetch('/aruaru_llm.v1.Llm/Generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, max_new_tokens: 20 })
    });
    const data = await res.json();
    genResult.textContent = res.ok ? (prompt + data.completion) : ('エラー: ' + data.error);
  } catch (e) {
    genResult.textContent = '通信エラー: ' + e;
  } finally {
    genBtn.disabled = false;
  }
});
</script>

<h2>この機械で動かせるモデル / Models for this machine</h2>
<p>
  <select id="fitLang"></select>
  <button id="fitBtn">一覧を表示 / Show list</button>
</p>
<p class="disclosure" id="fitExplain"></p>
<table id="fitTable" style="border-collapse:collapse"></table>
<div id="fitStatus"></div>
<script>
(function(){
  const sel = document.getElementById('fitLang'), btn = document.getElementById('fitBtn');
  const exp = document.getElementById('fitExplain'), tbl = document.getElementById('fitTable'), st = document.getElementById('fitStatus');
  let data = null;
  const call = async (m, body) => { const r = await fetch('/aruaru_llm.v1.Llm/' + m, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); return [r.ok, await r.json()]; };
  const show = () => { if (!data) return; const e = data.explanation.find(x => x[0] === sel.value); exp.textContent = e ? e[1] : ''; };
  const render = () => {
    tbl.textContent = '';
    data.models.forEach(m => {
      const tr = tbl.insertRow();
      [m.display_name_ja, (m.approx_size_mb / 1024).toFixed(1) + ' GB',
       m.fits ? '入る見込み / likely fits' : '重い / too heavy',
       (m.installed ? '導入済み / installed ' : '') + (m.recommended ? '★お勧め / recommended' : '')].forEach(t => { const td = tr.insertCell(); td.textContent = t; td.style.padding = '2px 8px'; td.style.border = '1px solid #8884'; });
      const td = tr.insertCell(); td.style.padding = '2px 8px';
      const b = document.createElement('button'); b.textContent = m.installed ? '使う / Use' : '導入 / Install';
      b.onclick = async () => {
        b.disabled = true; st.textContent = '処理中... / Working...';
        const fam = m.family === 'qwen' ? 'Qwen' : 'Models';
        if (!m.installed) { const [ok, d] = await call(fam + 'Install', { id: m.id }); if (!ok) { st.textContent = 'エラー: ' + (d.error || ''); b.disabled = false; return; } }
        const [ok2, d2] = await call(fam + 'Select', { id: m.id });
        st.textContent = ok2 ? '切り替えました / Switched: ' + m.id : 'エラー: ' + (d2.error || '');
        b.disabled = false;
      };
      td.appendChild(b);
    });
  };
  btn.onclick = async () => {
    btn.disabled = true;
    const [ok, d] = await call('ModelsCompatible');
    btn.disabled = false;
    if (!ok) { st.textContent = 'エラー'; return; }
    data = d;
    sel.textContent = '';
    d.explanation.forEach(x => { const o = document.createElement('option'); o.value = x[0]; o.textContent = x[0]; sel.appendChild(o); });
    sel.value = (navigator.language || 'en').startsWith('ja') ? 'ja' : 'en';
    sel.onchange = show; show(); render();
  };
})();
</script>
</body>
</html>
