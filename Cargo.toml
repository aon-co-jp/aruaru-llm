[package]
name = "aruaru-llm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aruaru-llm"
path = "src/main.rs"

[dependencies]
# 本家`poem`クレートへの直接依存を廃止し、RPoem(RPoem/crates/
# open-runo-poem-compat)のPoem互換ファサードへ移行(2026-07-31、
# ユーザー指示「RPoem(open-runo-poem-compat、Poem互換API面)への移行も
# 同時に始めて下さい」)。実体はtokio/hyper直接実装
# (open_runo_router::hyper_compat)であり、本家poemには依存しない。
open-runo-poem-compat = { path = "../RPoem/crates/open-runo-poem-compat" }
hyper = { version = "1", features = ["full"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
# open-cudaのCPUバックエンドをpath依存として使う(SET構成、CLAUDE.md参照)。
# デフォルトfeature(winfsp_backend/gpu_accel)を持たないため、WinFsp SDK/dxc
# 等は不要——rayon+anyhow+thiserror+tracingのみの軽量な依存グラフ。
opencuda-core = { path = "../open-cuda/crates/opencuda-core" }
opencuda-cpu = { path = "../open-cuda/crates/opencuda-cpu" }
opencuda-blas = { path = "../open-cuda/crates/opencuda-blas" }
# multilingual-e5-small(MIT)による実際の文埋め込み+コサイン類似度で意図分類する
# (旧: 固定語彙bag-of-words、2026-07-21移行、CLAUDE.md参照)。
open-cuda-bert = { path = "../open-cuda/crates/open-cuda-bert" }
# GPT-2 124M(openai-community/gpt2)実学習済み重みをロードし自己回帰的に
# 文章生成する(2026-07-25追加、CLAUDE.md参照)。意図分類(scoring.rs)とは
# 別の目的の別エンドポイント(/v1/generate)として提供する。
open-cuda-llm = { path = "../open-cuda/crates/open-cuda-llm" }
# モデルカタログ(2026-07-26追加)からのHugging Faceダウンロードに使う
# HTTPクライアント。OpenSSL不要のrustls-tlsを使用(他リポジトリの既存
# 方針〈aruaru-db等〉と同じ)。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# ハードウェア検出(2026-07-27追加、推奨LLMサイズ算出用)。既定では
# 無効(opt-in feature) — CPUのみの環境やAndroid等クロスコンパイル環境で
# Vulkanローダー/Windows SDKへの依存を強制しないため(既存の
# opencuda-vulkan/opencuda-directx側の設計方針〈real-vulkan/real-dx12が
# 既定featureに無い〉と同じ考え方)。`hw-detect-vulkan`/`hw-detect-directx`
# を有効にした場合のみ実GPU検出を試みる。いずれも無効ならCPU固定
# フォールバックのみで動作する(安全側)。
opencuda-vulkan = { path = "../open-cuda/crates/opencuda-vulkan", optional = true }
opencuda-directx = { path = "../open-cuda/crates/opencuda-directx", optional = true }
# オープンソース専用翻訳モデル(M2M100/NLLB)によるPOST /v1/translateの
# 品質改善(2026-08-04追加、ユーザー指示「翻訳精度が低ければオープン
# ソースの翻訳システムを組み込んで」)。GPT-2流用実装は実HTTP検証で
# 実用に耐えないと判明したための対応(CLAUDE.md参照)。**正直な開示**:
# `rust-bert`は`tch`(libtorch、PyTorchのC++ライブラリ)への依存が必須で、
# このエコシステムの「重量級MLフレームワーク非依存」という既定方針とは
# 異なる大きな依存を持ち込むため、既定featureには含めず`nllb-translate`
# feature配下でのみ有効にする(未指定時は既存のGPT-2流用実装のまま
# 動作し、この変更による既存ビルドへの影響はゼロ)。
rust-bert = { version = "0.23", optional = true }
# libtorchはビルド時Web自動ダウンロード(download-libtorch feature)ではなく、
# PCへ一度だけローカルインストールし`LIBTORCH`環境変数で固定パスを指す方式を
# 採用する(2026-08-04、ユーザー指示「libtorchは、WEB上ではなく、PCに
# インストール形で使用可能でしたらその様にしたい」)。
tch = { version = "0.17", optional = true }
# 地理・観光データベース(2026-08-11追加、ユーザー指示「日本全国・都道府県
# 別、アメリカは州別、世界中の首都名や観光名所・名物料理・お土産の
# DATABASEを作成して」)。aruaru-db(pgwireプロトコル、実質Postgres互換)へ
# 接続するための素のPostgresクライアント。aruaru-dbは`DUAL_DATABASE_URL`
# 経由で本物のPostgreSQLへ既にミラーする「DUAL DB」冗長化機能を持つため、
# クライアント側は単一のPostgres接続を張るだけでよい(aruaru-db側で
# 冗長化が完結する設計、詳細はPORTING.md参照)。
tokio-postgres = "0.7"
rand = "0.8"
# 埋め込み地理データ(data/geo_content.json)のパースにはRust-JSON
# (`../Rust-JSON`、旧称RJSON/RustJSON)を使う(ユーザー指示「JSONより
# RS-JSONを使って」)。内部的には`serde_json::Value`をそのまま使う設計
# (このクレート自身のdocコメント参照)なので、`serde_json::from_value`は
# 引き続き必要——置き換えたのは生の文字列パース呼び出し(`parse_strict`)
# のみで、型付きDeserialize自体はserdeに委ねる。
rust-json = { path = "../RS-JSON" }

[features]
default = []
hw-detect-vulkan = ["dep:opencuda-vulkan", "opencuda-vulkan/real-vulkan"]
nllb-translate = ["dep:rust-bert", "dep:tch"]
hw-detect-directx = ["dep:opencuda-directx", "opencuda-directx/real-dx12"]
# 実推論ディスパッチ先としてVulkanDeviceを使うオプトインfeature
# (2026-08-04追加、CLAUDE.md 2026-08-04 HANDOFF参照)。上記の
# `hw-detect-vulkan`はハードウェア検出(推奨LLMサイズ算出)専用であり、
# 本featureとは別軸——`main()`のデバイス選択(従来`CpuDevice::new(0)`
# 固定)を`opencuda_vulkan::real::VulkanDevice`へ切り替える。既定では
# 無効(CPUのみの環境やAndroid等クロスコンパイル環境にVulkanローダー
# 依存を強制しないため、既存の`hw-detect-vulkan`と同じ設計方針)。
real-vulkan = ["dep:opencuda-vulkan", "opencuda-vulkan/real-vulkan"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
