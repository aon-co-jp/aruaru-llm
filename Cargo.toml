[package]
name = "aruaru-llm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aruaru-llm"
path = "src/main.rs"

[dependencies]
# 本家`poem`クレートへの直接依存を廃止し、RPoem(RPoem/crates/
# open-runo-poem-compat)のPoem互換ファサードへ移行(2026-07-31、
# ユーザー指示「RPoem(open-runo-poem-compat、Poem互換API面)への移行も
# 同時に始めて下さい」)。実体はtokio/hyper直接実装
# (open_runo_router::hyper_compat)であり、本家poemには依存しない。
open-runo-poem-compat = { path = "../RPoem/crates/open-runo-poem-compat" }
hyper = { version = "1", features = ["full"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
# open-cudaのCPUバックエンドをpath依存として使う(SET構成、CLAUDE.md参照)。
# デフォルトfeature(winfsp_backend/gpu_accel)を持たないため、WinFsp SDK/dxc
# 等は不要——rayon+anyhow+thiserror+tracingのみの軽量な依存グラフ。
opencuda-core = { path = "../open-cuda/crates/opencuda-core" }
opencuda-cpu = { path = "../open-cuda/crates/opencuda-cpu" }
opencuda-blas = { path = "../open-cuda/crates/opencuda-blas" }
# multilingual-e5-small(MIT)による実際の文埋め込み+コサイン類似度で意図分類する
# (旧: 固定語彙bag-of-words、2026-07-21移行、CLAUDE.md参照)。
open-cuda-bert = { path = "../open-cuda/crates/open-cuda-bert" }
# GPT-2 124M(openai-community/gpt2)実学習済み重みをロードし自己回帰的に
# 文章生成する(2026-07-25追加、CLAUDE.md参照)。意図分類(scoring.rs)とは
# 別の目的の別エンドポイント(/v1/generate)として提供する。
open-cuda-llm = { path = "../open-cuda/crates/open-cuda-llm" }
# モデルカタログ(2026-07-26追加)からのHugging Faceダウンロードに使う
# HTTPクライアント。OpenSSL不要のrustls-tlsを使用(他リポジトリの既存
# 方針〈aruaru-db等〉と同じ)。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# ハードウェア検出(2026-07-27追加、推奨LLMサイズ算出用)。既定では
# 無効(opt-in feature) — CPUのみの環境やAndroid等クロスコンパイル環境で
# Vulkanローダー/Windows SDKへの依存を強制しないため(既存の
# opencuda-vulkan/opencuda-directx側の設計方針〈real-vulkan/real-dx12が
# 既定featureに無い〉と同じ考え方)。`hw-detect-vulkan`/`hw-detect-directx`
# を有効にした場合のみ実GPU検出を試みる。いずれも無効ならCPU固定
# フォールバックのみで動作する(安全側)。
opencuda-vulkan = { path = "../open-cuda/crates/opencuda-vulkan", optional = true }
opencuda-directx = { path = "../open-cuda/crates/opencuda-directx", optional = true }

[features]
default = []
hw-detect-vulkan = ["dep:opencuda-vulkan", "opencuda-vulkan/real-vulkan"]
hw-detect-directx = ["dep:opencuda-directx", "opencuda-directx/real-dx12"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
